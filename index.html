<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06352a">
<title>Game UNO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <section id="home" class="page">
    <div class="introIcon"><div class="unoBack">UNO</div></div>
    <h1>Game <b>UNO</b></h1>
    <p>Pilih strategi terbaikmu dan kalahkan Bot!</p>
    <button class="cta" id="play">MAIN DENGAN BOT</button>
  </section>

  <section id="levels" class="page hidden">
    <div class="introIcon"><span>🎮</span></div>
    <h1>Pilih Tingkat Kesulitan</h1>
    <p>Makin tinggi levelnya, makin licik Bot-nya.</p>
    <div class="levelRow">
      <button class="level active" data-level="easy">EASY</button>
      <button class="level" data-level="hard">HARD</button>
      <button class="level" data-level="master">MASTER</button>
    </div>
    <button class="linkBtn" id="back">← Kembali ke Awal</button>
  </section>

  <section id="board" class="board hidden">
    <div class="gameHeader">
      <div class="miniLogo"><div class="unoBack">UNO</div></div>
      <div class="title">Game <b>UNO</b></div>
      <span id="difficulty" class="pill">EASY</span>
      <button id="newGame" class="homeBtn">⌂</button>
    </div>

    <div class="person">
      <div class="avatar">🤖</div>
      <div><strong>Bot</strong><small id="botCount">7 kartu</small></div>
      <i id="botDot"></i>
    </div>
    <div id="botHand" class="botHand"></div>

    <div class="middle">
      <div class="pile">
        <label>AMBIL</label>
        <button id="draw" class="unoDeck"><span>UNO</span><em id="deckCount">0</em></button>
      </div>
      <div class="pile">
        <label>KARTU JALAN</label>
        <div id="topCard" class="unoCard big"></div>
      </div>
    </div>

    <div id="status" class="status">Giliran kamu</div>

    <div class="person you">
      <div class="avatar">😎</div>
      <div><strong>Kamu</strong><small id="youCount">7 kartu</small></div>
      <i id="youDot" class="active"></i>
    </div>

    <div id="playerHand" class="playerHand"></div>
    <button id="uno" class="unoCall">UNO!</button>
    <div class="hint">Ketuk kartu untuk bermain</div>
  </section>

  <div id="colorModal" class="overlay hidden">
    <div class="dialog">
      <h2>Pilih warna</h2>
      <div class="colors">
        <button class="red" data-color="red">MERAH</button>
        <button class="yellow" data-color="yellow">KUNING</button>
        <button class="green" data-color="green">HIJAU</button>
        <button class="blue" data-color="blue">BIRU</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
</div>
<script src="game.js"></script>
</body>
</html>
