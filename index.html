<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanz Clean - HD Video Processor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #020617;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        h1, .font-space {
            font-family: 'Space Grotesk', sans-serif;
        }
        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        .upload-box { transition: all 0.3s ease; }
        .upload-box:hover {
            border-color: #06b6d4;
            background-color: rgba(6, 182, 212, 0.05);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }
        .dragover {
            border-color: #3b82f6 !important;
            background-color: rgba(59, 130, 246, 0.1) !important;
            transform: scale(1.02);
        }
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg);
            transition: 0.5s;
        }
        .btn-shimmer:hover::after {
            left: 150%;
            transition: 0.7s ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative">

    <div class="absolute top-10 left-10 w-72 h-72 bg-purple-600 rounded-full mix-blend-screen filter blur-[120px] opacity-40 animate-blob"></div>
    <div class="absolute top-20 right-10 w-72 h-72 bg-cyan-600 rounded-full mix-blend-screen filter blur-[120px] opacity-40 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-72 h-72 bg-blue-600 rounded-full mix-blend-screen filter blur-[120px] opacity-40 animate-blob animation-delay-4000"></div>

    <div class="glass-panel p-8 sm:p-10 rounded-3xl w-full max-w-md text-center relative z-10 transition-transform duration-500 hover:shadow-[0_0_40px_rgba(6,182,212,0.15)]">
        
        <div class="inline-block mb-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-xs font-bold tracking-widest uppercase shadow-[0_0_10px_rgba(6,182,212,0.2)]">
            PRO ENGINE
        </div>
        <h1 class="text-4xl sm:text-5xl font-bold mb-1 text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-blue-500 to-purple-500">
            Yanz Clean
        </h1>
        <p class="text-xs text-gray-400 mb-8 font-medium tracking-wide">Developed by <span class="text-blue-400 font-semibold">Yanz Storu</span></p>
        
        <form id="uploadForm" class="space-y-6">
            <div id="dropzone" class="upload-box border-2 border-dashed border-gray-600 bg-gray-800/40 rounded-2xl p-8 cursor-pointer flex flex-col items-center justify-center relative overflow-hidden" onclick="document.getElementById('videoFile').click()">
                <div id="uploadIcon" class="p-4 bg-gray-900/60 rounded-full mb-3 shadow-lg transform transition-transform duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                </div>
                <p class="text-gray-200 font-semibold mb-1 text-sm sm:text-base font-space tracking-wide" id="fileLabel">Pilih atau Tarik Video ke Sini</p>
                <div class="flex items-center gap-2 mt-2">
                    <span class="text-[10px] bg-gray-700/50 text-gray-300 px-2 py-1 rounded-md">MP4</span>
                    <span class="text-[10px] bg-gray-700/50 text-gray-300 px-2 py-1 rounded-md" id="fileSizeLabel">Max 200MB</span>
                </div>
                <input type="file" id="videoFile" accept="video/*" class="hidden" required>
            </div>
            
            <div class="relative group">
                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 group-focus-within:text-green-400 transition-colors duration-300" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                    </svg>
                </div>
                <input type="number" id="waNumber" placeholder="Nomor WhatsApp (Contoh: 628...)" class="w-full py-4 pl-12 pr-4 rounded-xl bg-gray-900/60 border border-gray-700/60 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/40 text-white transition-all duration-300 placeholder-gray-500 text-sm font-space" required>
            </div>
            
            <button type="submit" id="uploadBtn" class="btn-shimmer w-full bg-gradient-to-r from-blue-600 via-cyan-600 to-purple-600 hover:from-blue-500 hover:via-cyan-500 hover:to-purple-500 text-white font-bold py-4 px-4 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.4)] hover:shadow-[0_0_30px_rgba(6,182,212,0.6)] transform hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-2 font-space tracking-wider">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                PROCESS TO HD
            </button>
        </form>
        
        <div class="grid grid-cols-2 gap-4 mt-8 pt-6 border-t border-gray-700/40">
            <a href="https://chat.whatsapp.com/EGyG72Fpxkg9VU8Aa7r0Kq?s=cl&p=a&mlu=0&ilr=4" target="_blank" class="group flex items-center justify-center gap-2 bg-[#25D366]/10 hover:bg-[#25D366]/20 border border-[#25D366]/30 text-[#25D366] font-semibold py-3 px-2 rounded-xl transition-all duration-300 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 2.19.71 4.2 1.91 5.83L3 21l3.27-.92A9.957 9.957 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm4.5 14c-.25.71-1.27 1.3-1.95 1.35-.58.05-1.32-.23-3.6-1.18-2.73-1.13-4.51-3.92-4.65-4.11-.14-.19-1.11-1.48-1.11-2.82 0-1.34.71-2 1-2.28.26-.25.59-.32.8-.32s.4 0 .58.01c.21.01.48-.08.73.53.27.65.92 2.25 1 2.44.08.19.14.41.01.66-.13.25-.19.41-.38.64-.19.22-.4.48-.57.65-.19.19-.39.4-.17.78.22.38.98 1.62 2.11 2.63 1.46 1.3 2.68 1.7 3.06 1.88.38.19.61.16.84-.11.23-.27.99-1.16 1.26-1.56.27-.4.54-.33.88-.2.35.13 2.19 1.03 2.56 1.22.38.19.64.28.73.44.09.16.09.94-.16 1.65z"/></svg>
                Join Group WA
            </a>
            <button onclick="showTutorial()" class="group flex items-center justify-center gap-2 bg-gray-800/40 hover:bg-gray-700/60 border border-gray-600/40 text-gray-300 font-semibold py-3 px-2 rounded-xl transition-all duration-300 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:rotate-12 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                Cara Pakai
            </button>
        </div>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const videoFile = document.getElementById('videoFile');
        const fileLabel = document.getElementById('fileLabel');
        const fileSizeLabel = document.getElementById('fileSizeLabel');
        const uploadIcon = document.getElementById('uploadIcon');
        
        // ⚠️ UBAH URL INI DENGAN URL API / IP PTERODACTYL KAMU ⚠️
        const API_URL = 'https://beige-ways-win.loca.lt/upload'; 
        const MAX_FILE_SIZE = 200 * 1024 * 1024; // 200MB

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => dropzone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => dropzone.classList.remove('dragover'), false);
        });

        dropzone.addEventListener('drop', (e) => {
            let dt = e.dataTransfer;
            let files = dt.files;
            videoFile.files = files;
            handleFiles();
        }, false);

        videoFile.addEventListener('change', handleFiles);

        function handleFiles() {
            if(videoFile.files.length > 0) {
                const file = videoFile.files[0];
                const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);

                if(!file.type.startsWith('video/')) {
                    showCustomAlert('File Tidak Valid!', 'Tolong upload file berformat video (.mp4, .mkv, dll)', 'error');
                    resetDropzone();
                    return;
                }

                if(file.size > MAX_FILE_SIZE) {
                    showCustomAlert('File Terlalu Besar!', `Ukuran video kamu ${fileSizeMB} MB. Batas maksimal adalah 200 MB.`, 'warning');
                    resetDropzone();
                    return;
                }

                fileLabel.textContent = file.name;
                fileSizeLabel.textContent = `${fileSizeMB} MB`;
                fileLabel.classList.add('text-cyan-400');
                uploadIcon.classList.add('scale-110', 'bg-cyan-900/80');
            }
        }

        function resetDropzone() {
            videoFile.value = ''; 
            fileLabel.textContent = 'Pilih atau Tarik Video ke Sini';
            fileSizeLabel.textContent = 'Max 200MB';
            fileLabel.classList.remove('text-cyan-400');
            uploadIcon.classList.remove('scale-110', 'bg-cyan-900/80');
        }

        function showCustomAlert(title, text, icon) {
            Swal.fire({
                icon: icon, title: title, text: text,
                background: 'rgba(15, 23, 42, 0.95)', color: '#fff',
                backdrop: 'rgba(0,0,0,0.7) backdrop-blur-sm',
                confirmButtonColor: '#06b6d4',
                customClass: { popup: 'rounded-2xl border border-gray-700/50' }
            });
        }

        function showTutorial() {
            Swal.fire({
                title: '<span class="text-2xl font-space font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Tutorial Yanz Clean</span>',
                html: `
                    <div class="text-left space-y-4 text-sm mt-4 text-gray-300">
                        <div class="flex items-start gap-3 p-3 bg-gray-800/50 rounded-xl border border-gray-700/50">
                            <span class="text-xl">1️⃣</span> <p>Pilih file video atau <b>Tarik (Drag)</b> video ke kotak upload (Maks 200 MB).</p>
                        </div>
                        <div class="flex items-start gap-3 p-3 bg-gray-800/50 rounded-xl border border-gray-700/50">
                            <span class="text-xl">2️⃣</span> <p>Ketik Nomor WA kamu yang terdaftar di Grup WhatsApp Yanz Clean.</p>
                        </div>
                        <div class="flex items-start gap-3 p-3 bg-gray-800/50 rounded-xl border border-gray-700/50">
                            <span class="text-xl">3️⃣</span> <p>Klik tombol <b class="text-cyan-400">PROCESS TO HD</b>.</p>
                        </div>
                        <div class="flex items-start gap-3 p-3 bg-gray-800/50 rounded-xl border border-gray-700/50">
                            <span class="text-xl">4️⃣</span> <p>Tunggu sebentar, Bot akan merender video ke <b>1080p 60fps</b> lalu mengirimnya otomatis ke Grup!</p>
                        </div>
                    </div>`,
                background: 'rgba(15, 23, 42, 0.98)', backdrop: 'rgba(0,0,0,0.8) backdrop-blur-md',
                color: '#fff', confirmButtonColor: '#0ea5e9', confirmButtonText: 'Siap Menggunakan',
                customClass: { popup: 'rounded-3xl border border-gray-700/50' }
            });
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const file = videoFile.files[0];
            const waNumber = document.getElementById('waNumber').value;
            
            if(!file) return showCustomAlert('Kosong!', 'Silakan pilih video terlebih dahulu.', 'warning');

            const formData = new FormData();
            formData.append('video', file);
            formData.append('nomor', waNumber);

            Swal.fire({
                title: '<span class="font-space text-xl text-cyan-400">Uploading & Rendering...</span>',
                html: '<div class="text-gray-300 text-sm mt-2">Menerapkan filter <b>1080p 60FPS</b>.<br><span class="text-xs text-gray-500 mt-2 block">Jangan tutup halaman ini sampai selesai.</span></div>',
                allowOutsideClick: false,
                background: 'rgba(15, 23, 42, 0.95)', backdrop: 'rgba(0,0,0,0.8) backdrop-blur-md', color: '#fff',
                customClass: { popup: 'rounded-2xl border border-cyan-900/50 shadow-[0_0_30px_rgba(6,182,212,0.2)]' },
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const response = await fetch(API_URL, { method: 'POST', body: formData });

                if(response.ok) {
                    Swal.fire({
                        title: 'Upload Sukses! 🚀',
                        text: 'Video sedang diproses server. Silakan cek Grup WhatsApp kamu dalam beberapa menit.',
                        icon: 'success',
                        background: 'rgba(15, 23, 42, 0.95)', color: '#fff',
                        backdrop: 'rgba(0,0,0,0.8) backdrop-blur-md',
                        confirmButtonColor: '#10B981',
                        customClass: { popup: 'rounded-3xl border border-gray-700/50' }
                    });
                    document.getElementById('uploadForm').reset();
                    resetDropzone();
                } else if(response.status === 413) {
                     showCustomAlert('Ditolak Server', 'Video terlalu besar. Maksimal 200MB.', 'error');
                } else {
                    showCustomAlert('Gagal', 'Terjadi kesalahan di server Bot.', 'error');
                }
            } catch (error) {
                showCustomAlert('Koneksi Terputus', 'Gagal menghubungi server Bot Pterodactyl. Pastikan bot aktif.', 'error');
            }
        });
    </script>
</body>
</html>
